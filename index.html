<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление Фиксации Неизбежного</title>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
       :root {
    --bg-color: #1a1a1d; /* Темно-титановый фон */
    --card-bg: #2d2d30; /* Чуть более светлый серый для самой формы */
    --text-main: #e0e0e0; /* Светло-серый текст */
    --text-muted: #888890; /* Приглушенный текст */
    --border-color: #44444a; /* Темные границы */
    --primary-red: #00d2ff; /* Неоново-голубой вместо красного */
    --primary-hover: #00a8cc; /* Чуть темнее при наведении */
}

/* Переопределение желтого баннера для техно-стиля */
.warning-banner {
    background-color: rgba(255, 204, 0, 0.1) !important;
    color: #ffcc00 !important; /* Сигнальный желтый */
    border-left: 4px solid #ffcc00 !important;
}

        body {
            background-color: var(--bg-color);
            font-family: 'Roboto', 'Heebo', sans-serif;
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.06);
            width: 100%;
            max-width: 700px;
            padding: 30px;
            box-sizing: border-box;
            position: relative;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        h1 { font-size: 20px; margin: 0; font-weight: 700; }

        .warning-banner {
            background-color: #FFF3F4;
            color: var(--primary-red);
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 25px;
            border-left: 4px solid var(--primary-red);
        }

        .field-group { margin-bottom: 25px; }
        label { display: block; font-weight: 500; margin-bottom: 8px; font-size: 15px; }
        .sub-label { font-size: 12px; color: var(--text-muted); margin-bottom: 10px; line-height: 1.4; }

        .slider-container { display: flex; align-items: center; gap: 15px; }
        input[type=range] { flex-grow: 1; accent-color: var(--primary-red); cursor: pointer; }
        .slider-value { 
            background: var(--bg-color); padding: 4px 12px; border-radius: 12px; 
            font-weight: 700; color: var(--primary-red); border: 1px solid var(--border-color);
            min-width: 20px; text-align: center;
        }

        .modern-input {
            width: 100%; padding: 12px; border-radius: 8px; 
            border: 1px solid var(--border-color); font-family: inherit; font-size: 15px;
            box-sizing: border-box; outline: none;
        }

        .radio-group, .check-group { display: flex; flex-direction: column; gap: 12px; }
        .radio-group label, .check-group label { 
            display: flex; align-items: flex-start; font-weight: 400; cursor: pointer; font-size: 14px;
        }
        input[type="radio"], input[type="checkbox"] { 
            accent-color: var(--primary-red); margin: 3px 10px 0 0; transform: scale(1.1); 
            flex-shrink: 0;
        }
        [dir="rtl"] input[type="radio"], [dir="rtl"] input[type="checkbox"] { margin: 3px 0 0 10px; }

        .btn-primary {
            background-color: var(--primary-red); color: white; border: none;
            padding: 16px 24px; border-radius: 28px; font-size: 16px; font-weight: 700;
            width: 100%; cursor: pointer; transition: background-color 0.2s; margin-top: 10px;
            font-family: inherit;
        }
        .btn-primary:hover { background-color: var(--primary-hover); }

        .btn-lang {
            background: var(--bg-color);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 12px;
            text-align: center;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-lang:hover { border-color: var(--primary-red); background: #fff; }

        .btn-secondary {
            background: none; color: var(--text-muted); border: none; padding: 10px;
            width: 100%; cursor: pointer; font-size: 14px; text-decoration: underline; font-family: inherit;
        }

        .block { display: none; animation: fadeIn 0.4s ease forwards; }
        .block.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .risk-card {
            background: var(--bg-color); padding: 15px; border-radius: 12px;
            margin-bottom: 12px; border: 1px solid var(--border-color);
        }
        .risk-card:has(input:checked) { border-color: var(--primary-red); background: #fff; }
        .risk-card strong { display: block; margin-bottom: 5px; color: var(--primary-red); }

        .disclaimer { font-size: 11px; color: var(--text-muted); text-align: center; margin-top: 25px; line-height: 1.5; }
    </style>
</head>
<body>

<div class="card">
    <div id="block0" class="block active">
        <h1 style="text-align: center; margin-bottom: 30px;">Выберите язык / Choose Language / בחר שפה</h1>
        <div style="display: flex; flex-direction: column;">
            <div class="btn-lang" onclick="setLanguage('he')">עברית</div>
            <div class="btn-lang" onclick="setLanguage('ru')">Русский</div>
            <div class="btn-lang" onclick="setLanguage('en')">English</div>
        </div>
    </div>

    <div id="main-content" style="display: none;">
        <div class="header">
            <h1 id="t-window-title">Форма 404-Алеф</h1>
            <div id="t-current-lang" style="font-size: 12px; color: var(--text-muted);"></div>
        </div>

        <div class="warning-banner" id="t-warning"></div>

        <div id="block1" class="block">
            <div class="field-group">
                <label id="t-name"></label>
                <input type="text" class="modern-input" id="t-name-placeholder" placeholder="">
            </div>
            <div class="field-group">
                <label id="t-anxiety"></label>
                <div class="slider-container">
                    <input type="range" id="anxietySlider" min="0" max="10" value="7" oninput="enforceMinAnxiety(this)">
                    <div class="slider-value" id="anxietyVal">7</div>
                </div>
            </div>
            <div class="field-group">
                <label id="t-wear"></label>
                <div class="sub-label" id="t-wear-desc"></div>
                <select class="modern-input" id="conflictSelect"></select>
            </div>
            <div class="field-group">
                <label id="t-news"></label>
                <div class="radio-group">
                    <label><input type="radio" name="news" value="yes" checked> <span class="t-yes"></span></label>
                    <label><input type="radio" name="news" value="no"> <span class="t-no"></span></label>
                </div>
            </div>
            <div class="field-group">
                <label id="t-consent" style="font-weight: 400; font-size: 13px;">
                    <input type="checkbox" id="consentCheck"> 
                    <span id="t-consent-text"></span>
                </label>
            </div>
            <button class="btn-primary" id="t-next-btn" onclick="validateStep1()"></button>
        </div>

        <div id="block2" class="block">
            <label id="t-risks-title" style="font-size: 18px; margin-bottom: 20px;"></label>
            <div id="risks-container"></div>
            <button class="btn-primary" id="t-pay-btn" onclick="goToStep3()"></button>
            <button class="btn-secondary" onclick="goToStep1()" id="t-back-1"></button>
        </div>

        <div id="block3" class="block">
            <label id="t-pay-title" style="font-size: 18px; margin-bottom: 20px;"></label>
            <div class="radio-group">
                <label class="risk-card"><input type="radio" name="payment" value="nerves"> <span id="t-pay-1"></span></label>
                <label class="risk-card"><input type="radio" name="payment" value="sleep"> <span id="t-pay-2"></span></label>
                <label class="risk-card"><input type="radio" name="payment" value="oblivion"> <span id="t-pay-3"></span></label>
            </div>
            <button class="btn-primary" id="t-finish-btn"></button>
            <button class="btn-secondary" onclick="goToStep2()" id="t-back-2"></button>
        </div>

        <div class="disclaimer" id="t-disclaimer"></div>
    </div>
</div>

<script>
    let currentLang = 'ru';
    
    // Базовый словарь для элементов, которых нет в таблице
    const translations = {
        ru: { dir: "ltr", yes: "Да", no: "Нет" },
        en: { dir: "ltr", yes: "Yes", no: "No" }
    };

    const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQeKQogEEDNWY626wZDamnMfGNimCIMFqwP9_spwPc-qotu_yQq7jKMzF1YeFzfBSrFAbCCO8UNvMwZ/pub?output=tsv';

    async function loadDataFromCloud() {
        try {
            const response = await fetch(SHEET_URL);
            const data = await response.text();
            const lines = data.split('\n');
            
            for (let i = 1; i < lines.length; i++) {
                const columns = lines[i].split('\t');
                if (columns.length >= 3) {
                    const key = columns[0].trim();
                    translations.ru[key] = columns[1].trim();
                    translations.en[key] = columns[2].trim();
                }
            }
        } catch (error) {
            console.error("Сбой матрицы:", error);
            alert("Ошибка связи с облаком. Данные не загружены.");
        }
    }

    async function setLanguage(lang) {
        if (lang === 'he') {
            alert("Иврит временно отключен (отсутствует в базе данных).");
            return;
        }
        
        document.getElementById('block0').innerHTML = "<h2 style='text-align:center;'>Устанавливаем связь с сервером...</h2>";
        
        await loadDataFromCloud(); 
        
        currentLang = lang;
        document.getElementById('block0').style.display = 'none';
        document.getElementById('main-content').style.display = 'block';
        changeLanguage();
        goToStep1();
    }

    function enforceMinAnxiety(slider) {
        if (parseInt(slider.value) < 4) slider.value = 4;
        document.getElementById('anxietyVal').innerText = slider.value;
    }

    function validateStep1() {
        if (!document.getElementById('consentCheck').checked) {
            alert(translations[currentLang].alertConsent || "Подтвердите согласие.");
            return;
        }
        goToStep2();
    }

    function goToStep1() { switchBlock('block1'); }
    function goToStep2() { renderRisks(); switchBlock('block2'); }
    function goToStep3() { switchBlock('block3'); }

    function switchBlock(id) {
        document.querySelectorAll('.block').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        window.scrollTo(0,0);
    }

    function renderRisks() {
        const container = document.getElementById('risks-container');
        const risksKeys = ['risk1','risk2','risk3','risk4','risk5','risk6','risk7','risk8','risk9'];
        container.innerHTML = risksKeys.map(k => translations[currentLang][k] ? `
            <div class="risk-card">
                <label><input type="checkbox"><span>${translations[currentLang][k]}</span></label>
            </div>
        ` : '').join('');
    }

    function populateConflictSelect(lang) {
        const select = document.getElementById('conflictSelect');
        const cur = select.value || "0";
        select.innerHTML = '';
        for (let i = 0; i <= 47; i++) {
            let text = i + (lang === 'ru' ? ' конфл.' : ' conf.');
            const opt = document.createElement('option');
            opt.value = i; opt.innerText = text;
            if (i.toString() === cur) opt.selected = true;
            select.appendChild(opt);
        }
    }

    function changeLanguage() {
        const dict = translations[currentLang];
        
        const setTxt = (id, key) => { if(document.getElementById(id) && dict[key]) document.getElementById(id).innerText = dict[key]; };
        const setHtml = (id, key) => { if(document.getElementById(id) && dict[key]) document.getElementById(id).innerHTML = dict[key]; };

        setTxt('t-window-title', 'window-title');
        setTxt('t-warning', 'warning');
        setTxt('t-name', 'name');
        if (document.getElementById('t-name-placeholder')) document.getElementById('t-name-placeholder').placeholder = dict['name-placeholder'] || '';
        setTxt('t-anxiety', 'anxiety');
        setTxt('t-wear', 'wear');
        setTxt('t-wear-desc', 'wear-desc');
        setTxt('t-news', 'news');
        setTxt('t-consent-text', 'consent-text');
        setTxt('t-next-btn', 'next-btn');
        setTxt('t-risks-title', 'risks-title');
        setTxt('t-pay-btn', 'pay-btn');
        setTxt('t-pay-title', 'pay-title');
        
        setHtml('t-pay-1', 'pay-1');
        setHtml('t-pay-2', 'pay-2');
        setHtml('t-pay-3', 'pay-3');
        
        setTxt('t-finish-btn', 'finish-btn');
        setTxt('t-back-1', 'back-1');
        setTxt('t-back-2', 'back-2');
        setTxt('t-disclaimer', 'disclaimer');
        
        document.querySelectorAll('.t-yes').forEach(el => el.innerText = dict["yes"]);
        document.querySelectorAll('.t-no').forEach(el => el.innerText = dict["no"]);
        
        populateConflictSelect(currentLang);
    }
</script>
</body>
</html>
