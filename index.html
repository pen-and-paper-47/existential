<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Стартовая страница - Форма 404-Алеф</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="landing-body">

    <!-- Видео на фоне -->
    <div class="video-wrapper">
        <video class="real-video" src="bg-video.mp4" autoplay loop muted playsinline></video>
    </div>

    <!-- Заголовок слева (переводится со сменой языка, рамка с блёром 4px) -->
    <div class="top-brand-badge" id="t-window-title">Форма 404-Алеф</div>

    <!-- Переключатель языка справа (адаптивный: кнопки или дропдаун) -->
    <div class="lang-selector-top">
        <!-- Версия для широких экранов -->
        <div class="lang-buttons-desktop">
            <button class="btn-lang-small active" onclick="setLanguage('ru')" id="btn-ru-desk">Русский</button>
            <button class="btn-lang-small" onclick="setLanguage('en')" id="btn-en-desk">English</button>
        </div>

        <!-- Версия-дропдаун для узких экранов (активируется, если заголовок близко) -->
        <div class="lang-dropdown-mobile">
            <button class="btn-lang-small" onclick="toggleLangDropdown()">🌐 <span id="current-lang-label">RU</span></button>
            <div class="lang-menu" id="langMenu">
                <button class="lang-option" onclick="setLanguage('ru')">Русский</button>
                <button class="lang-option" onclick="setLanguage('en')">English</button>
            </div>
        </div>
    </div>

    <!-- Слоган наверху поверх видео -->
    <div class="landing-slogan" id="t-slogan">Загрузка...</div>

    <!-- Кнопка внизу с блёром -->
    <div class="landing-container">
        <button class="btn-primary" id="t-find-plan" onclick="goToForm()" style="max-width: 350px;">Загрузка...</button>
    </div>

    <script src="landing.js"></script>
</body>
</html>
