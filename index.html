<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Стартовая страница - Форма 404-Алеф</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="landing-body">

    <!-- Видео на фоне -->
    <div class="video-wrapper">
        <video class="real-video" src="Landing_video_1.mp4" autoplay loop muted playsinline></video>
    </div>

    <!-- Заголовок слева (по размеру и стилю как кнопки языков) -->
    <div class="top-brand-badge" id="t-window-title">Форма 404-Алеф</div>
    
    <!-- Переключатель языка -->
    <div class="lang-selector-top">
        <button class="btn-lang-small active" onclick="setLanguage('ru')" id="btn-ru">Русский</button>
        <button class="btn-lang-small" onclick="setLanguage('en')" id="btn-en">English</button>
    </div>

    <!-- Слоган размещается прямо поверх видео на нужной высоте -->
    <div class="landing-slogan" id="t-slogan">Загрузка...</div>

    <!-- Прозрачный блок с кнопкой внизу -->
    <div class="landing-container">
        <button class="btn-primary" id="t-find-plan" onclick="goToForm()" style="max-width: 350px;">Загрузка...</button>
    </div>

    <script src="landing.js"></script>
</body>
</html>
