<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>АЛЕФ-404 — Экран процесса</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="screens.css?v=5">
</head>
<body class="screen-office">

    <div id="officeContent" class="lang-swap">
        <div class="office-band">
            <div class="brand-mark light"><span class="brand-circle">א</span><span class="brand-name"><span class="brand-name-ru">Форма 404 Алеф</span><span class="brand-name-en">Tofes 404 Aleph</span></span></div>
            <div class="office-titles">
                <h1 id="titleText"></h1>
                <p class="office-slogan" id="sloganText"></p>
            </div>
        </div>

        <div class="office-steps" id="officeSteps">
            <div class="connector-layer" id="connectorLayer"></div>
            <div class="step-card">
                <div class="step-num">1</div>
                <div class="step-title" id="title1"></div>
                <div class="step-desc" id="desc1"></div>
            </div>
            <div class="step-card">
                <div class="step-num">2</div>
                <div class="step-title" id="title2"></div>
                <div class="step-desc" id="desc2"></div>
            </div>
            <div class="step-card">
                <div class="step-num">3</div>
                <div class="step-title" id="title3"></div>
                <div class="step-desc" id="desc3"></div>
            </div>
            <div class="step-card">
                <div class="step-num">4</div>
                <div class="step-title" id="title4"></div>
                <div class="step-desc" id="desc4"></div>
            </div>
            <div class="step-card">
                <div class="step-num">5</div>
                <div class="step-title" id="title5"></div>
                <div class="step-desc" id="desc5"></div>
            </div>
            <div class="step-card final">
                <div class="step-num">✓</div>
                <div class="step-title" id="title6"></div>
                <div class="step-desc" id="desc6"></div>
            </div>
        </div>

        <div class="office-ticker">
            <div class="ticker-track" id="tickerTrack"></div>
        </div>

        <div class="office-disclaimer" id="disclaimerText"></div>
    </div>

<script src="screen-office.js?v=5"></script>
</body>
</html>
