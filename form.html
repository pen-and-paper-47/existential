<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форма 404-Алеф</title>
    
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
        (function() { emailjs.init("y-TivV15Lqje7LYSA"); })();
    </script>
</head>
<body>

<div id="main-content" class="card">
    <div class="header">
        <h1 id="t-window-title">Загрузка...</h1>
    </div>

    <div class="warning-banner" id="t-warning"></div>

    <!-- БЛОК 1 -->
    <div id="block1" class="block active">
        <div class="field-group" id="field-name">
            <label id="t-name"></label>
            <input type="text" class="modern-input" id="t-name-placeholder" placeholder="">
        </div>
        
        <div class="field-group" id="field-anxiety" style="display: none; animation: fadeIn 0.4s ease forwards;">
            <label id="t-anxiety"></label>
            <div class="slider-container">
                <input type="range" id="anxietySlider" min="0" max="10" value="7" oninput="enforceMinAnxiety(this)">
                <div class="slider-value" id="anxietyVal">7</div>
            </div>
        </div>
        
        <div class="field-group" id="field-wear" style="display: none; animation: fadeIn 0.4s ease forwards;">
            <label id="t-wear"></label>
            <div class="sub-label" id="t-wear-desc"></div>
            <select class="modern-input" id="conflictSelect"></select>
        </div>
        
        <div class="field-group" id="field-news" style="display: none; animation: fadeIn 0.4s ease forwards;">
            <label id="t-news"></label>
            <div class="slider-container">
                <input type="range" id="newsSlider" min="0" max="49" value="15" oninput="updateNewsSlider()">
                <div class="slider-value" id="newsValText">2 часа</div>
            </div>
        </div>
        
        <div class="field-group">
            <label id="t-consent" style="font-weight: 400; font-size: 13px;">
                <input type="checkbox" id="consentCheck"> 
                <span id="t-consent-text"></span>
            </label>
        </div>
        <button class="btn-primary" id="t-next-btn" onclick="goToStep2()"></button>
    </div>

    <!-- Модальное окно алертов -->
    <div class="modal-overlay" id="aleph-alert-modal">
        <div class="modal-box">
            <div class="modal-title">АЛЕФ 404 says:</div>
            <div id="aleph-alert-msg" style="font-size: 16px; margin-bottom: 25px; line-height: 1.5;"></div>
            <button class="btn-primary" onclick="document.getElementById('aleph-alert-modal').style.display='none'">OK</button>
        </div>
    </div>

    <!-- Таймер бездействия -->
    <div class="modal-overlay" id="timeout-modal">
        <div class="modal-box">
            <div class="modal-title">АЛЕФ 404 says:</div>
            <div id="timeout-msg" style="font-size: 16px;"></div>
            <div class="timer-text" id="countdown-timer">15</div>
            <button class="btn-primary" id="btn-continue" onclick="continueSession()">Продолжаем</button>
            <button class="btn-secondary" id="btn-abort" onclick="resetToMain()" style="border: 1px solid var(--border-color); border-radius: 20px; margin-top: 10px;">Прерываемся</button>
        </div>
    </div>

    <!-- БЛОК 2: РИСКИ -->
    <div id="block2" class="block">
        <label id="t-risks-title" style="font-size: 18px; margin-bottom: 20px; color: var(--growth-green); font-weight: 700;"></label>
        <div id="risks-container"></div>
        <button class="btn-primary" id="t-pay-btn" onclick="goToStep3()"></button>
        <button class="btn-secondary" onclick="goToStep1()" id="t-back-1"></button>
    </div>

    <!-- БЛОК 3: ОПЛАТА И СБОР ДАННЫХ -->
    <div id="block3" class="block">
        <label id="t-pay-title" style="font-size: 18px; margin-bottom: 20px; color: var(--growth-green); font-weight: 700;"></label>
        
        <div class="radio-group" id="payment-options">
            <label class="risk-card">
                <input type="radio" name="payment" value="nerves"> 
                <div>
                    <div class="pay-option-header">
                        <span id="t-pay-1"></span>
                        <span class="info-icon" tabindex="0">i
                            <span class="info-tooltip" id="t-info-nerves"></span>
                        </span>
                    </div>
                    <div id="calc-nerves" class="calc-badge"></div>
                </div>
            </label>
            <label class="risk-card">
                <input type="radio" name="payment" value="sleep"> 
                <div>
                    <div class="pay-option-header">
                        <span id="t-pay-2"></span>
                        <span class="info-icon" tabindex="0">i
                            <span class="info-tooltip" id="t-info-sleep"></span>
                        </span>
                    </div>
                    <div id="calc-sleep" class="calc-badge"></div>
                </div>
            </label>
            <label class="risk-card">
                <input type="radio" name="payment" value="oblivion"> 
                <div>
                    <div class="pay-option-header">
                        <span id="t-pay-3"></span>
                        <span class="info-icon" tabindex="0">i
                            <span class="info-tooltip" id="t-info-oblivion"></span>
                        </span>
                    </div>
                    <div id="calc-oblivion" class="calc-badge"></div>
                </div>
            </label>
            <label class="risk-card">
                <input type="radio" name="payment" value="data" id="pay-data-radio"> 
                <div>
                    <span id="t-pay-4"></span>
                    <div id="calc-data" class="calc-badge"></div>
                </div>
            </label>
        </div>

        <div id="data-payment-fields" style="display: none; padding: 18px; border: 2px dashed var(--primary-red); margin-bottom: 15px; background: #fff3e0; border-radius: 12px; animation: fadeIn 0.4s ease forwards;">
            <div class="field-group" style="margin-bottom: 15px;">
                <label id="t-dob-label" style="font-size: 14px; color: #e65100;"></label>
                <input type="date" id="userDob" value="1990-01-01" min="1900-01-01" max="2026-12-31" oninput="calculatePremiums()" style="width: 100%; padding: 22px; font-size: 20px; font-weight: 700; text-align: center; color: var(--primary-red); background-color: #fff; border: 3px solid var(--border-color); border-radius: 16px; cursor: pointer; outline: none; box-sizing: border-box; font-family: inherit;">
            </div>
        </div>

        <div class="field-group" style="margin-top: 25px; padding-top: 20px; border-top: 2px dashed var(--border-color);">
           <label id="t-email-label" style="color: var(--primary-red); font-size: 14px;"></label>
            <input type="email" id="userEmail" class="modern-input" placeholder="ваша@почта.com">
            <div id="t-email-disclaimer" style="font-size: 11.5px; color: var(--text-muted); margin-top: 15px; line-height: 1.5;"></div>
        </div>

        <button class="btn-primary" id="t-finish-btn" onclick="collectFinalData()">Получить План Защиты</button>
        <button class="btn-secondary" onclick="goToStep2()" id="t-back-2">Вернуться назад</button>
    </div>
    
    <div class="disclaimer" id="t-disclaimer"></div>
</div>

<!-- БЛОК 4: ЭКРАН СПАСИБО -->
<div id="block4" class="block">
    <h2 id="t-thanks-title">Спасибо за доверие</h2>
    <h3 id="t-thanks-slogan"></h3>
    <p id="thank-you-message" style="margin-bottom: 30px; font-size: 16px; line-height: 1.5;"></p>
    <button class="btn-primary" onclick="resetToMain()" style="border-radius: 12px; padding: 16px; width: 100%; max-width: 350px;" id="t-back-main"></button>
</div>

<!-- МАКЕТ PDF -->
<div id="pdf-template" style="width: 210mm; min-height: 297mm; padding: 20mm; box-sizing: border-box; background: #fff; color: #2b3a4a; font-family: 'Roboto', sans-serif;">
    <div style="border: 2px solid #4caf50; padding: 20mm; height: 100%; position: relative; box-sizing: border-box;">
        <div style="position: absolute; top: 15mm; right: 15mm; width: 30mm; height: 30mm; border: 2px solid #ff9800; border-radius: 50%; display: flex; align-items: center; justify-content: center; transform: rotate(-15deg); color: #ff9800; font-weight: bold; text-align: center; font-size: 10px;">ВЕЧНЫЙ<br>АРХИВ</div>
        <h1 id="pdf-title-text" style="color: #4caf50; border-bottom: 2px solid #d1e8e2; padding-bottom: 10px; font-size: 24px;"></h1>
        <h3 style="color: #8fa3b3; font-style: italic; font-size: 16px; margin-bottom: 30px;" id="pdf-slogan"></h3>
        
        <div style="font-size: 14px; line-height: 1.8;">
            <p><strong>Идентификатор субъекта:</strong> <span id="pdf-name" style="border-bottom: 1px solid #ccc; padding-bottom: 2px;"></span></p>
            <p><strong>Уровень тревожности (0-10):</strong> <span id="pdf-anxiety"></span></p>
            <p><strong>Метод списания премии:</strong> <span id="pdf-payment"></span></p>
            <p><strong><span id="pdf-cost-label"></span></strong> <span id="pdf-cost-value" style="color: #e65100; font-weight: bold;"></span></p>
        </div>

        <div style="margin-top: 30px; padding: 15px; background: #f9f9f9; border-left: 4px solid #4caf50;">
            <strong style="font-size: 14px;">Объекты покрытия:</strong>
            <ul id="pdf-risks-list" style="font-size: 12px; margin-top: 10px; line-height: 1.6;"></ul>
        </div>
        
        <div style="position: absolute; bottom: 20mm; left: 20mm; right: 20mm; font-size: 10px; color: #8fa3b3; text-align: center; border-top: 1px solid #eee; padding-top: 10mm;">
            Данный документ подтверждает защиту от экзистенциальных угроз в рамках симуляции.
        </div>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
