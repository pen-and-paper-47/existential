<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форма 404-Алеф</title>
    
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.3/html2pdf.bundle.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
        (function() { emailjs.init("y-TivV15Lqje7LYSA"); })();
    </script>
</head>
<body>

<div id="main-content" class="card">
    <div class="header">
        <h1 id="t-window-title">Загрузка...</h1>
    </div>

    <div class="warning-banner" id="t-warning"></div>

    <!-- БЛОК 1 -->
    <div id="block1" class="block active">
        <div class="field-group" id="field-name">
            <label id="t-name"></label>
            <input type="text" class="modern-input" id="t-name-placeholder" placeholder="">
        </div>
        
        <div class="field-group" id="field-anxiety" style="display: none; animation: fadeIn 0.4s ease forwards;">
            <label id="t-anxiety"></label>
            <div class="slider-container">
                <div class="slider-value" id="anxietyVal">7</div>
                <input type="range" id="anxietySlider" min="0" max="10" value="7" oninput="enforceMinAnxiety(this)">
            </div>
        </div>
        
        <div class="field-group" id="field-wear" style="display: none; animation: fadeIn 0.4s ease forwards;">
            <label id="t-wear"></label>
            <div class="sub-label" id="t-wear-desc"></div>
            <select class="modern-input" id="conflictSelect"></select>
        </div>
        
        <div class="field-group" id="field-news" style="display: none; animation: fadeIn 0.4s ease forwards;">
            <label id="t-news"></label>
            <div class="slider-container">
                <div class="slider-value" id="newsValText">2 часа</div>
                <input type="range" id="newsSlider" min="0" max="49" value="15" oninput="updateNewsSlider()">
            </div>
        </div>
        
        <div class="field-group">
            <label id="t-consent" style="font-weight: 400; font-size: 13px;">
                <input type="checkbox" id="consentCheck"> 
                <span id="t-consent-text"></span>
            </label>
        </div>
        <button class="btn-primary" id="t-next-btn" onclick="goToStep2()"></button>
    </div>

    <!-- Модальное окно алертов -->
    <div class="modal-overlay" id="aleph-alert-modal">
        <div class="modal-box">
            <div class="modal-title">АЛЕФ 404 says:</div>
            <div id="aleph-alert-msg" style="font-size: 16px; margin-bottom: 25px; line-height: 1.5;"></div>
            <button class="btn-primary" onclick="document.getElementById('aleph-alert-modal').style.display='none'">OK</button>
        </div>
    </div>
<!-- Модальное окно: Сенсорный календарь для iPad -->
    <div class="modal-overlay" id="dob-modal">
        <div class="modal-box dob-modal-card">
            <div class="modal-title" id="t-dob-modal-title">Калибровка цифрового следа</div>
            
            <div class="dob-picker-controls">
                <select id="dob-select-month" class="dob-select" onchange="renderDobCalendar()"></select>
                <select id="dob-select-year" class="dob-select" onchange="renderDobCalendar()"></select>
            </div>

            <div class="dob-calendar-weekdays" id="dob-weekdays"></div>
            <div class="dob-calendar-grid" id="dob-calendar-grid"></div>

            <button type="button" class="btn-primary" onclick="confirmDobSelection()" id="t-dob-confirm">Выбрать дату</button>
            <button type="button" class="btn-secondary" onclick="closeDobModal()" id="t-dob-cancel" style="margin-top: 8px;">Отмена</button>
        </div>
    </div>
    <!-- Таймер бездействия -->
    <div class="modal-overlay" id="timeout-modal">
        <div class="modal-box">
            <div class="modal-title">АЛЕФ 404 says:</div>
            <div id="timeout-msg" style="font-size: 16px;"></div>
            <div class="timer-text" id="countdown-timer">15</div>
            <button class="btn-primary" id="btn-continue" onclick="continueSession()">Продолжаем</button>
            <button class="btn-secondary" id="btn-abort" onclick="resetToMain()" style="border: 1px solid var(--border-color); border-radius: 20px; margin-top: 10px;">Прерываемся</button>
        </div>
    </div>

    <!-- БЛОК 2: РИСКИ -->
    <div id="block2" class="block">
        <label id="t-risks-title" style="font-size: 18px; margin-bottom: 20px; color: var(--growth-green); font-weight: 700;"></label>
        <div id="risks-container"></div>
        <button class="btn-primary" id="t-pay-btn" onclick="goToStep3()"></button>
        <button class="btn-secondary" onclick="goToStep1()" id="t-back-1"></button>
    </div>

   <!-- ЭКРАН 3: ОПЛАТА И СБОР ДАННЫХ -->
    <div id="block3" class="block">
        <label id="t-pay-title" style="font-size: 18px; margin-bottom: 20px; color: var(--growth-green); font-weight: 700;"></label>
        
        <div class="radio-group" id="payment-options">
            <label class="risk-card">
                <input type="radio" name="payment" value="nerves"> 
                <div>
                    <div class="pay-option-header">
                        <span id="t-pay-1"></span>
                        <span class="info-icon" tabindex="0">i
                            <span class="info-tooltip" id="t-info-nerves"></span>
                        </span>
                    </div>
                    <div id="calc-nerves" class="calc-badge"></div>
                </div>
            </label>

            <label class="risk-card">
                <input type="radio" name="payment" value="sleep"> 
                <div>
                    <div class="pay-option-header">
                        <span id="t-pay-2"></span>
                        <span class="info-icon" tabindex="0">i
                            <span class="info-tooltip" id="t-info-sleep"></span>
                        </span>
                    </div>
                    <div id="calc-sleep" class="calc-badge"></div>
                </div>
            </label>

            <label class="risk-card">
                <input type="radio" name="payment" value="oblivion"> 
                <div>
                    <div class="pay-option-header">
                        <span id="t-pay-3"></span>
                        <span class="info-icon" tabindex="0">i
                            <span class="info-tooltip" id="t-info-oblivion"></span>
                        </span>
                    </div>
                    <div id="calc-oblivion" class="calc-badge"></div>
                </div>
            </label>

            <label class="risk-card">
                <input type="radio" name="payment" value="data" id="pay-data-radio"> 
                <div>
                    <div class="pay-option-header">
                        <span id="t-pay-4"></span>
                    </div>
                    <div id="calc-data" class="calc-badge"></div>
                </div>
            </label>
        </div>

        <!-- Выпадающий блок оплаты данными (если используется) -->
        <div id="data-payment-fields" style="display: none; padding: 18px; border: 2px dashed var(--primary-red); margin-top: 15px; background: #fff3e0; border-radius: 14px;">
            <div class="field-group" style="margin-bottom: 0;">
                <label id="t-dob-label" style="font-size: 14px; color: #e65100; margin-bottom: 8px;"></label>
                <div class="dob-input-container">
                    <input type="text" id="userDob" class="modern-input dob-input" value="1990-01-01" placeholder="YYYY-MM-DD" oninput="handleDobManualInput(this.value)">
                    <button type="button" class="dob-calendar-btn" onclick="openDobModal()">📅</button>
                </div>
            </div>
        </div>

        <!-- Секция ввода email с красивой подложкой -->
        <div class="email-section">
            <label id="t-email-label" style="color: var(--primary-red); font-size: 14px; font-weight: 600; margin-bottom: 8px;"></label>
            <input type="email" id="userEmail" class="modern-input" placeholder="ваша@почта.com" style="background: #ffffff;">
            <div id="t-email-disclaimer" style="font-size: 11.5px; color: var(--text-muted); margin-top: 10px; line-height: 1.5;"></div>
        </div>

        <button class="btn-primary" id="t-finish-btn" onclick="collectFinalData()"></button>
        <button class="btn-secondary" onclick="goToStep2()" id="t-back-2"></button>
    </div>
    
    <div class="disclaimer" id="t-disclaimer"></div>
</div>

<!-- БЛОК 4: ЭКРАН СПАСИБО -->
<div id="block4" class="block">
    <!-- Заголовок и скромный слоган под ним -->
    <h2 id="t-thanks-title">Спасибо за доверие</h2>
    <h3 id="t-thanks-slogan" style="color: var(--text-muted); font-style: italic; font-size: 14px; margin-bottom: 25px; font-weight: 400;"></h3>
    
    <p id="thank-you-message" style="margin-bottom: 30px; font-size: 16px; line-height: 1.5; width: 100%;"></p>
    
    <!-- Кнопка возврата -->
    <button class="btn-primary" onclick="resetToMain()" style="border-radius: 12px; padding: 16px; width: 100%; max-width: 350px;" id="t-back-main"></button>
    
    <!-- Дисклеймер под кнопкой -->
    <div class="disclaimer" id="t-thanks-disclaimer" style="margin-top: 20px;"></div>
</div>

<!-- МАКЕТ PDF: полис -->
<div id="pdf-template">
    <div class="pdf-sheet">

        <!-- Верхняя полоса: бренд + номер полиса -->
        <div class="pdf-band">
            <div class="pdf-band-brand">
                <span class="pdf-band-mark">A</span>
                <span class="pdf-band-name" id="pdf-band-name">АЛЕФ-404</span>
            </div>
            <div class="pdf-band-meta">
                <div class="pdf-band-meta-row"><span id="pdf-policy-number-label">№ полиса</span><span id="pdf-policy-number">—</span></div>
                <div class="pdf-band-meta-row"><span id="pdf-issue-date-label">Дата выдачи</span><span id="pdf-issue-date">—</span></div>
            </div>
        </div>
        <div class="pdf-rule-gold"></div>

        <div class="pdf-body">
            <h1 id="pdf-title-text" class="pdf-title"></h1>
            <p id="pdf-slogan" class="pdf-slogan"></p>

            <!-- Раздел с данными застрахованного -->
            <div class="pdf-declarations">
                <div class="pdf-decl-row">
                    <span class="pdf-decl-label" id="pdf-name-label"></span>
                    <span class="pdf-decl-value" id="pdf-name"></span>
                </div>
                <div class="pdf-decl-row">
                    <span class="pdf-decl-label" id="pdf-anxiety-label"></span>
                    <span class="pdf-decl-value" id="pdf-anxiety"></span>
                </div>
                <div class="pdf-decl-row">
                    <span class="pdf-decl-label" id="pdf-payment-label"></span>
                    <span class="pdf-decl-value" id="pdf-payment"></span>
                </div>
            </div>

            <!-- Перечень объектов покрытия -->
            <div class="pdf-schedule">
                <div class="pdf-schedule-header" id="pdf-risks-header"></div>
                <ol class="pdf-schedule-list" id="pdf-risks-list"></ol>
            </div>

            <!-- Премия -->
            <div class="pdf-premium">
                <span class="pdf-premium-label" id="pdf-cost-label"></span>
                <span class="pdf-premium-value" id="pdf-cost-value"></span>
            </div>

            <!-- Печать и подпись -->
            <div class="pdf-signature-row">
                <div class="pdf-seal">
                    <span id="pdf-seal-text"></span>
                </div>
                <div class="pdf-signature-block">
                    <div class="pdf-signature-line"></div>
                    <div id="pdf-signature-label" class="pdf-signature-label"></div>
                </div>
            </div>
        </div>

        <div class="pdf-barcode" id="pdf-barcode"></div>
        <div id="pdf-footer-text" class="pdf-footer-text"></div>
        <div id="pdf-happening-note" class="pdf-happening-note"></div>
    </div>
</div>
    
<script src="app.js"></script>

<!-- Тематический лоадер генерации -->
<div class="modal-overlay" id="generation-loader" style="display: none; z-index: 10000; flex-direction: column; background: rgba(43, 58, 74, 0.92); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);">
    <div class="loader-spinner"></div>
    <div id="loader-title" style="color: var(--growth-green); font-size: 20px; font-weight: 800; margin-top: 24px; text-transform: uppercase; letter-spacing: 2px;">АЛЕФ-404</div>
    <div id="loader-subtext" style="color: #ffffff; font-size: 15px; margin-top: 12px; font-style: italic; opacity: 0.9;">Инициализация...</div>
</div>
    
</body>
</html>
